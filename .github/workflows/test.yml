name: Build and Test

on:
  push:
    branches: [master]
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: npm install and build
      run: npm ci
    - name: lint
      run: npm run lint
    - name: test
      run: npm run test

